name: Deploy docs

on:
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # onBrokenLinks is 'throw', so a broken cross-page link fails here rather
        # than shipping a dead link.
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler.toml declares docs.usekazuni.com as a custom domain. Cloudflare
        # creates that DNS record itself, so the Workers-scoped token is enough.
        # Declaring routes without 'workers_dev = true' also disables the
        # workers.dev hostname, so kazuni-docs.fickson-limited.workers.dev now
        # 404s and docs.usekazuni.com is the only way in.
        run: npx wrangler deploy
