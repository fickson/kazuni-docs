# Cloudflare Workers Configuration for Kazuni Documentation
name = "kazuni-docs"
main = "worker.ts"
compatibility_date = "2026-02-02"

# Must be explicit. Omitting it alongside routes makes wrangler disable the
# workers.dev hostname, and that reconciliation reads /zones/<id>/workers/routes,
# which the Workers-scoped token cannot. kazuni-web sets this and deploys custom
# domains against the same account without trouble.
workers_dev = true

# Cloudflare provisions the DNS record for a custom domain itself, so the
# Workers-scoped API token is sufficient here and no Edit-zone-DNS token is
# needed.
routes = [
  { pattern = "docs.usekazuni.com", custom_domain = true }
]

[assets]
directory = "build"
